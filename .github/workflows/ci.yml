name: ci

# every push and pull request runs the tests. pushes to main and version tags (v1.2.3) also
# publish the image to ghcr.io/ethanrweber/plex-light-sync.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # a release tag (v1.2.3) must match the app version, which home assistant installs, and the project version
      - name: check the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(sed -n 's/^version: "\(.*\)"$/\1/p' plex-light-sync/config.yaml)
          project=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/PlexLightSync/PlexLightSync.csproj)
          echo "tag $tag, app $app, project $project"
          test "$tag" = "$app" && test "$tag" = "$project"

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # the video tests run ffmpeg on clips that they generate
      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: test
        run: dotnet test

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # tags: "main" for the main branch, "1.2.3" and "1.2" for a version tag, and the commit sha
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
